# Nginx Reverse Proxy Configuration for Separate Services
upstream languagetool_backend {
    server languagetool:8010;
}

upstream jwt_validator_backend {
    server jwt-validator:3000;
}

server {
    listen 80;
    server_name localhost;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS headers for all requests
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
    add_header 'Access-Control-Max-Age' 86400 always;

    # Handle preflight OPTIONS requests globally
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        add_header 'Content-Type' 'text/plain; charset=utf-8' always;
        add_header 'Content-Length' 0 always;
        return 204;
    }

    # Main health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"spell-check-proxy","timestamp":"$time_iso8601","services":{"languagetool":"http://languagetool:8010","jwt-validator":"http://jwt-validator:3000"}}';
        add_header Content-Type application/json;
    }

    # JWT Authentication endpoints
    location /auth/ {
        proxy_pass http://jwt_validator_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;

        # Remove any existing CORS headers from backend to avoid duplicates
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
    }

    # LanguageTool spell/grammar checking endpoints
    location /v2/ {
        proxy_pass http://languagetool_backend/v2/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # Pass through Authorization header for JWT validation
        proxy_pass_header Authorization;

        # Remove any existing CORS headers from backend to avoid duplicates
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
    }

    # Direct proxy to LanguageTool root (for any other endpoints)
    location /languagetool/ {
        rewrite ^/languagetool/(.*)$ /$1 break;
        proxy_pass http://languagetool_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Remove any existing CORS headers from backend to avoid duplicates
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
    }

    # Service information endpoint
    location /info {
        access_log off;
        return 200 '{"service":"spell-check-microservice","version":"1.0.0","architecture":"separate-services","endpoints":{"spellcheck":"/v2/check","auth":"/auth/","health":"/health","languages":"/v2/languages"},"description":"Spell and grammar checking service with JWT authentication"}';
        add_header Content-Type application/json;
    }

    # Default route
    location / {
        return 200 '{"service":"spell-check-microservice","status":"running","endpoints":["/v2/check","/auth/","/health","/info"],"note":"Spell and grammar checking service with JWT authentication"}';
        add_header Content-Type application/json;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Disable server tokens
    server_tokens off;
}