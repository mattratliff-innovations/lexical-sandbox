# Simple nginx configuration without external dependencies

events {
    worker_connections 1024;
}

http {
    # Inline mime types - no external file needed
    types {
        text/html                             html htm shtml;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        text/plain                           txt;
        application/xml                       xml;
        application/x-www-form-urlencoded    form;
    }
    
    default_type application/octet-stream;
    
    # Simplified logging (will create files if they don't exist)
    access_log /tmp/nginx_languagetool_access.log;
    error_log /tmp/nginx_languagetool_error.log warn;
    
    # Basic settings
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Upstream servers
    upstream languagetool {
        server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    }
    
    upstream jwt_validator {
        server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    }

    server {
    listen 8010;
    server_name localhost;

    # Enable CORS for all origins (adjust as needed for production)
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
    add_header 'Access-Control-Max-Age' 86400 always;

    # Handle preflight requests
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Proxy to LanguageTool
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Additional proxy settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
}